[project]
name = "civ-workshop"
version = "0.1.0"
description = "Offline participant tooling for the CIV 2026 data hackathon"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cel-python==0.5.0",
    "mcap>=1.4.0,<2",
    "mcap-ros2-support>=0.5.7,<0.6",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
civ = "civ_workshop.participant_cli:main"

[build-system]
requires = ["uv-build>=0.8.15,<0.9"]
build-backend = "uv_build"
