spec: civ.eventspec/v1alpha1
name: kashiwa-right-turn-with-object-context
signals:
  yaw_rate:
    topic: /localization/kinematic_state
    field: twist.twist.angular.z
  object_detected:
    topic: /perception/object_recognition/is_object_detected
    field: data
condition: yaw_rate <= -0.25 && object_detected == true
timing:
  min_duration: 0.5s
  merge_gap: 0.75s
  max_duration: 15s
evidence:
  before: 2s
  after: 2s
  topics:
    - /localization/kinematic_state
    - /perception/object_recognition/detected_object
    - /perception/object_recognition/is_object_detected
    - /sensing/camera/traffic_light/image_raw/compressed
